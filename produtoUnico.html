<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto Unico - Rua Bike Shop</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/produto.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
  <div class="container">

    <div class="left">  
      <button class="menu-toggle" id="menu-toggle"> ☰ </button>

      <div class="logo"> 
        <img src="assets/imagens/Logo transparente - Cópia.png" alt="Logo">
      </div>    
    </div>

    <div class="right">
      <div class="search-wrapper">
        <button class="search-btn">🔍</button>
      </div>

      <button class="cart-btn">
        🛒 <span class="cart-count">0</span>
      </button>
  
      <nav class="menu" id="menu">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li class="has-submenu">
            <button class="submenu-toggle">Produtos ▾</button>

            <ul class="submenu">
              <li><a href="#">Bikes Completas</a></li>
              <li><a href="#">Bancos</a></li>
              <li><a href="#">Cubos</a></li>
              <li><a href="#">Manoplas</a></li>
              <li><a href="#">Pedais</a></li>
              <li><a href="#">Quadros</a></li>
            </ul>
          </li>
          <li><a href="carrinho.html">Carrinho</a></li>
        </ul>
      </nav>
    </div>

  </div>
</header>

<!-- BANNER -->
<section class="banner">
  <div class="slider">
    <div class="slide">
      <img src="assets/imagens/produtos/bsd-banner-bikecheck-joefoley-003-jan2025_1900x.webp">
    </div>
  </div>
</section>

<section class="banner-text">
  <h2>FRETE GRÁTIS PARA TODO O BRASIL</h2>
  <p>Parcele suas compras em até 12x</p>
</section>

<!-- PRODUTO -->
<section class="product-page">
  <div class="product-layout">

    <!-- GALERIA -->
    <div class="product-gallery">
      <div class="main-image">
        <img id="mainProductImage" src="assets/imagens/produtos/cultbike.webp">
      </div>
    </div>

    <!-- DETALHES DINÂMICOS -->
    <div class="product-detail">
      <div id="productDetail"></div>
    </div>

  </div>
</section>

<!-- FOOTER -->
<footer class="footer">
  <div class="footer-container">

    <div class="footer-col logo-col">
      <img src="assets/imagens/rualogo 2026.PNG">
    </div>

    <div class="footer-col">
      <h3>MAPA DO SITE</h3>
      <ul>
        <li><a href="#">Início</a></li>
        <li><a href="#">Loja</a></li>
      </ul>
    </div>

    <div class="footer-col">
      <h3>POLÍTICAS</h3>
      <ul>
        <li><a href="#">Privacidade</a></li>
      </ul>
    </div>

  </div>

  <div class="footer-bottom">
    <p>© 2026 Rua Bike Shop</p>
  </div>
</footer>

<!-- SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {

  // MENU
  const menuToggle = document.getElementById("menu-toggle");
  const menu = document.getElementById("menu");

  menuToggle.addEventListener("click", function () {
    menu.classList.toggle("active");
  });

  document.querySelectorAll(".submenu-toggle").forEach(button => {
    button.addEventListener("click", function (e) {
      e.stopPropagation();
      this.nextElementSibling.classList.toggle("active");
    });
  });

  // PEGAR ID DA URL
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  console.log("ID do produto:", id);

});



document.addEventListener("DOMContentLoaded", async function () {

  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  console.log("ID do produto:", id);

  if (!id) {
    console.error("ID não encontrado na URL");
    return;
  }

  try {
    const response = await fetch(`http://localhost:4000/products/${id}`);
    const product = await response.json();

    console.log("Produto recebido:", product);

    const container = document.getElementById("productDetail");

    container.innerHTML = `
      <h1 class="product-title">${product.name}</h1>

      <p class="product-price">
        R$ ${Number(product.price).toFixed(2)}
      </p>

      <p>${product.description || "Sem descrição"}</p>

      <button class="buy-btn">
        COMPRAR
      </button>
    `;

    Number(product.price).toLocaleString("pt-BR", {
  style: "currency",
  currency: "BRL"
})

  } catch (error) {
    console.error("Erro ao buscar produto:", error);
  }

});
</script>

</body>
</html>
