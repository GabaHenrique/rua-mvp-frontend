<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Rua Bike Shop</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="admin-login-page">
    <div class="admin-login-card">
      <img src="../assets/imagens/rualogo 2026.PNG" alt="Logo Rua" class="admin-login-logo">

      <h1>Login Admin</h1>
      <p class="admin-login-subtitle">Acesse o painel administrativo</p>

      <form id="login-form" class="admin-login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" id="login-btn" class="admin-login-btn">
          Entrar
        </button>

        <p id="login-message" class="login-message"></p>
      </form>
    </div>
  </div>

<script src="../js/config.js"></script>
<script src="js/login.js"></script>
</body>
</html>
